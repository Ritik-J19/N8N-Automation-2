[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "channel-factory"
version = "0.1.0"
description = "Human-reviewed, multi-channel video drafting and assembly CLI"
requires-python = ">=3.11"
dependencies = [
  "espeakng-loader>=0.2.4,<0.3",
  "fastapi>=0.162,<0.163",
  "google-genai>=1.0,<2",
  "imageio-ffmpeg>=0.6,<0.7",
  "Pillow>=11,<13",
  "PyYAML>=6,<7",
  "uvicorn>=0.54,<0.55",
]

[project.optional-dependencies]
dev = ["httpx2>=2.16,<3", "pytest>=8,<10"]
piper = ["piper-tts>=1.3,<2"]
youtube = ["google-api-python-client>=2,<3", "google-auth-oauthlib>=1,<2"]

[project.scripts]
channel-factory = "channel_factory.cli:main"

[tool.setuptools.packages.find]
include = ["channel_factory*"]

[tool.setuptools.package-data]
channel_factory = [
  "profiles/**/*.yaml",
  "profiles/**/*.md",
  "samples/*.json",
  "web/static/*",
]

[tool.pytest.ini_options]
testpaths = ["channel_factory/tests"]
addopts = "-q"
markers = ["live: requires an external service and explicit credentials"]

