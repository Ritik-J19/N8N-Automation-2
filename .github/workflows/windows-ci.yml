name: Windows offline verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run offline tests
        run: python -m pytest -m "not live"
      - name: Check local runtime
        run: python -m channel_factory phase0-check
      - name: Run MockLLM end to end
        run: python -m channel_factory demo --workspace "$env:RUNNER_TEMP\channel-factory-demo" --approve
